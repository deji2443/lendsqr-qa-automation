name: Lendsqr Adjutor API Automation
on: [push]

permissions:
  contents: write

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman & Allure Reporter
        run: npm install -g newman newman-reporter-allure newman-reporter-htmlextra

      - name: Run Postman API Tests
        continue-on-error: true
        run: |
          newman run collection.json \
          --env-var "token=${{ secrets.ADJUTOR_API_KEY }}" \
          --reporters cli,allure,htmlextra \
          --reporter-allure-export allure-results \
          --reporter-htmlextra-export api-report-summary.html

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxvf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Create Professional GitHub Summary
        if: always()
        run: |
          echo "### Adjutor API Automation Results 🚀" >> $GITHUB_STEP_SUMMARY
          echo "The test suite has executed against the Lendsqr Adjutor Staging environment." >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 **Interactive Dashboard:** [View Live Allure Report](https://deji2443.github.io/lendsqr-qa-automation/)" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 **Build Status:** ${{ job.status == 'success' && '✅ Passed' || '⚠️ Issues Found (Check Report)' }}" >> $GITHUB_STEP_SUMMARY
          echo "### Performance & Security Observations" >> $GITHUB_STEP_SUMMARY
          echo "Detailed performance inferences and security findings are documented in the attached Google Sheet." >> $GITHUB_STEP_SUMMARY

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lendsqr-api-reports
          path: |
            allure-report
            api-report-summary.html
          retention-days: 7